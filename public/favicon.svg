<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Monogramme AM : encre crème sur charbon, aux couleurs du site.
       Lettres tracées en polygones pour ne dépendre d'aucune police. -->
  <rect width="64" height="64" rx="10" fill="#16130f"/>

  <!-- A : deux jambages et une barre -->
  <path fill="#efe9dc" d="M8 45 17.4 15h7.2L34 45h-7.3l-1.6-6h-8.2L15.3 45zm9.5-11.7h5.3L20.2 24z"/>

  <!-- M : quatre montants, sommet en pointe -->
  <path fill="#efe9dc" d="M36 45V15h6.7l5.1 13.3L52.9 15H60v30h-6V28.5l-3.7 9.7h-3.3L43.3 28.5V45z"/>

  <!-- Accent vermillon : le filet de soulignement de la marque -->
  <rect x="8" y="49.5" width="48" height="4" rx="2" fill="#e05a35"/>
</svg>
