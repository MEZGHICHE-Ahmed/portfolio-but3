name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Autorise le workflow à publier sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        # Le site est servi depuis https://<compte>.github.io/<dépôt>/ :
        # Vite doit préfixer les liens vers ses ressources en conséquence.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Rediriger les URL profondes vers l'application
        # GitHub Pages sert des fichiers statiques : une URL comme
        # /competences/... n'existe pas sur le disque. En servant index.html
        # comme page 404, le routeur reprend la main et affiche la bonne page.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
